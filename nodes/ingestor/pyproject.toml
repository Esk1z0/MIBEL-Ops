[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mibel-ingestor"
version = "0.1.0"
description = "MIBEL-Ops ingestor node: lightweight capture, edge validation and delivery of Iberian electricity market data"
readme = "README.md"
requires-python = ">=3.10"
# Runtime core: no pandas, no pydantic (NFR-02, ADR-05). Heavy or optional parts live in extras.
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]            # MIBGAS yearly Excel file
kafka = ["confluent-kafka>=2.3"]     # production sink (aarch64 wheels available)
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-requests", "types-PyYAML"]

[project.scripts]
mibel-ingestor = "mibel_ingestor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # en dashes and arrows in docstrings are intended

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "synthetic"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "benchmarks"]
mypy_path = ["src", "tests", "tests/fixtures"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "confluent_kafka.*"]
ignore_missing_imports = true
